<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Atlas de Obsesiones</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    header {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f0f6fc;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }

    #viewport {
      width: 100vw;
      height: 100vh;
      position: relative;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* Controles de Zoom Flotantes */
    .controls {
      position: absolute;
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .btn-ctrl {
      width: 44px;
      height: 44px;
      background: rgba(22, 27, 34, 0.85);
      color: #f0f6fc;
      border: 1px solid #30363d;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    }

    .btn-ctrl:active {
      background: #21262d;
      transform: scale(0.92);
    }

    /* Modal / Pop-up de Collage */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      max-width: 620px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      transform: scale(0.96);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-header {
      padding: 16px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #21262d;
    }

    .modal-header h2 {
      font-size: 1.25rem;
      color: #f0f6fc;
      font-weight: 700;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
    }

    .modal-body {
      padding: 18px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Collage dinámico sin huecos */
    .collage-container {
      display: grid;
      gap: 8px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #0d1117;
      grid-auto-flow: dense;
    }

    .collage-container.count-1 {
      grid-template-columns: 1fr;
      max-height: 420px;
    }

    .collage-container.count-2 {
      grid-template-columns: 1fr 1fr;
      max-height: 330px;
    }

    .collage-container.count-3 {
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 155px 155px;
    }
    .collage-container.count-3 img:first-child {
      grid-row: span 2;
    }

    .collage-container.count-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 140px 140px;
    }

    .collage-container.count-many {
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 125px;
    }

    .collage-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #58a6ff;
    }

    /* Créditos de autoría / enlaces */
    .modal-credits {
      font-size: 0.75rem;
      color: #8b949e;
      border-top: 1px solid #21262d;
      padding-top: 8px;
      margin-top: 2px;
    }

    .modal-credits a {
      color: #58a6ff;
      text-decoration: none;
    }

    .modal-credits a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>Atlas de Obsesiones</h1>
  </header>

  <div id="viewport">
    <canvas id="atlasCanvas"></canvas>
  </div>

  <div class="controls">
    <button class="btn-ctrl" id="zoomIn">+</button>
    <button class="btn-ctrl" id="zoomOut">−</button>
    <button class="btn-ctrl" id="zoomReset">⟲</button>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Detalle</h2>
        <button class="btn-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div id="modalCollage" class="collage-container"></div>
        <div class="modal-tags" id="modalTags"></div>
        <div class="modal-credits" id="modalCredits"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("atlasCanvas");
    const ctx = canvas.getContext("2d");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalClose = document.getElementById("modalClose");
    const modalCollage = document.getElementById("modalCollage");
    const modalTags = document.getElementById("modalTags");
    const modalCredits = document.getElementById("modalCredits");

    let width = window.innerWidth;
    let height = window.innerHeight;

    let camera = {
      x: 0,
      y: 0,
      zoom: 1.0,
      minZoom: 0.5,
      maxZoom: 3.5
    };

    const BASE_RADIUS = 280;
    const NODE_RADIUS = 24;

    const emotions = [
      { name: "Alegría",  angle: 0 },
      { name: "Sorpresa", angle: Math.PI / 3 },
      { name: "Miedo",    angle: (2 * Math.PI) / 3 },
      { name: "Ira",      angle: Math.PI },
      { name: "Asco",     angle: (4 * Math.PI) / 3 },
      { name: "Tristeza", angle: (5 * Math.PI) / 3 }
    ];

    // Orden de pesos: [Alegría, Sorpresa, Miedo, Ira, Asco, Tristeza]
    const items = [
      {
        id: "hilbert",
        name: "Hotel de Hilbert",
        weights: [0.45, 0.55, 0.0, 0.0, 0.0, 0.0],
        images: ["img/hilbert.jpeg"],
        credits: null
      },
      {
        id: "gatita",
        name: "Gato",
        weights: [0.50, 0.15, 0.35, 0.0, 0.0, 0.0],
        images: ["img/gatita1.jpeg", "img/gatita2.jpeg", "img/gatita3.jpeg"],
        credits: null
      },
      {
        id: "orquideas",
        name: "Orquídeas",
        weights: [0.40, 0.60, 0.0, 0.0, 0.0, 0.0],
        images: ["img/orquidea1.jpeg", "img/orquideahombre.jpeg"],
        credits: null
      },
      {
        id: "luz",
        name: "Luz",
        // Catalizador omnidireccional: reparte peso equitativo y queda en el centro (0,0)
        weights: [0.1667, 0.1667, 0.1667, 0.1667, 0.1666, 0.1666],
        images: ["img/luz.jpeg", "img/luz2.jpeg"],
        credits: null
      },
      {
        id: "terror",
        name: "Terror",
        weights: [0.0, 0.35, 0.50, 0.0, 0.0, 0.15],
        images: ["img/ahs.jpeg", "img/nuestrapartedenoche.jpeg", "img/ahs13.jpeg"],
        credits: {
          text: "Fotografías y cartelería promocional de obras referenciadas (Mariana Enriquez / FX)",
          url: null
        }
      },
      {
        id: "discos",
        name: "Música",
        weights: [0.40, 0.0, 0.15, 0.0, 0.0, 0.45],
        images: ["img/ginger.jpeg", "img/itsbeenawful.jpeg", "img/deltaplane.jpeg", "img/data.jpeg", "img/atavista.jpeg"],
        credits: {
          text: "Portadas de álbumes oficiales",
          url: null
        }
      },
      {
        id: "vulneracion",
        name: "Vulneración de identidad",
        weights: [0.0, 0.0, 0.0, 0.60, 0.40, 0.0],
        images: ["img/vulneracion.jpg"],
        credits: {
          text: "Pol Kurucz — Serie 'Glam Jail'",
          url: "https://www.polkurucz.com/glam-jail/dyza5qqfna7glfrt1kge9khxwdjp7s"
        }
      },
      {
        id: "hermanos",
        name: "Hermanos",
        weights: [0.65, 0.15, 0.20, 0.0, 0.0, 0.0],
        images: ["img/hm1.jpeg", "img/hm2.jpeg", "img/hm3.jpeg", "img/hm4.jpeg", "img/hm5.jpeg"],
        credits: null
      },
      {
        id: "padre",
        name: "Padre",
        weights: [0.60, 0.15, 0.0, 0.0, 0.0, 0.25],
        images: ["img/poli.jpeg", "img/poli1.jpeg", "img/poli2.jpeg"],
        credits: null
      },
      {
        id: "naturaleza",
        name: "Huida al monte",
        weights: [0.70, 0.20, 0.0, 0.0, 0.0, 0.10],
        images: ["img/nature1.jpeg", "img/nature2.jpeg"],
        credits: null
      }
    ];

    // Carga robusta de imágenes sin bloquear dibujado
    const imageCache = {};
    items.forEach(item => {
      const img = new Image();
      img.src = item.images[0];
      img.onload = () => render();
      img.onerror = () => render();
      imageCache[item.id] = img;
    });

    let nodes = [];
    function computeNodes() {
      nodes = items.map(item => {
        let bx = 0, by = 0;
        item.weights.forEach((w, idx) => {
          bx += w * (BASE_RADIUS * Math.cos(emotions[idx].angle));
          by += w * (-BASE_RADIUS * Math.sin(emotions[idx].angle));
        });
        return {
          ...item,
          origX: bx,
          origY: by,
          x: bx,
          y: by,
          radius: NODE_RADIUS
        };
      });

      // Separación física suave anti-solape
      const minDist = NODE_RADIUS * 2.3;
      for (let iter = 0; iter < 50; iter++) {
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[j].x - nodes[i].x;
            const dy = nodes[j].y - nodes[i].y;
            const dist = Math.hypot(dx, dy) || 0.001;
            if (dist < minDist) {
              const overlap = (minDist - dist) / 2;
              const nx = dx / dist;
              const ny = dy / dist;
              nodes[i].x -= nx * overlap;
              nodes[i].y -= ny * overlap;
              nodes[j].x += nx * overlap;
              nodes[j].y += ny * overlap;
            }
          }
          nodes[i].x += (nodes[i].origX - nodes[i].x) * 0.04;
          nodes[i].y += (nodes[i].origY - nodes[i].y) * 0.04;
        }
      }
    }

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);
      render();
    }
    window.addEventListener("resize", resize);

    function render() {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      ctx.save();
      ctx.translate(width / 2 + camera.x, height / 2 + camera.y);
      ctx.scale(camera.zoom, camera.zoom);

      // Anillos concéntricos de referencia
      [0.33, 0.66, 1.0].forEach(level => {
        ctx.strokeStyle = level === 1.0 ? "#30363d" : "#1c2128";
        ctx.lineWidth = (level === 1.0 ? 1.8 : 1) / camera.zoom;
        ctx.beginPath();
        emotions.forEach((e, i) => {
          const vx = BASE_RADIUS * level * Math.cos(e.angle);
          const vy = -BASE_RADIUS * level * Math.sin(e.angle);
          if (i === 0) ctx.moveTo(vx, vy);
          else ctx.lineTo(vx, vy);
        });
        ctx.closePath();
        ctx.stroke();
      });

      // Ejes radiales y nombres de las 6 emociones
      emotions.forEach(e => {
        const vx = BASE_RADIUS * Math.cos(e.angle);
        const vy = -BASE_RADIUS * Math.sin(e.angle);

        ctx.strokeStyle = "#21262d";
        ctx.lineWidth = 1.2 / camera.zoom;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(vx, vy);
        ctx.stroke();

        const lx = (BASE_RADIUS + 32) * Math.cos(e.angle);
        const ly = -(BASE_RADIUS + 32) * Math.sin(e.angle);

        ctx.fillStyle = "#58a6ff";
        ctx.font = `bold ${13 / camera.zoom}px system-ui`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(e.name, lx, ly);
      });

      // Render de los nodos
      nodes.forEach(node => {
        const img = imageCache[node.id];

        ctx.save();
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.clip();

        if (img && img.complete && img.naturalWidth !== 0) {
          ctx.drawImage(img, node.x - node.radius, node.y - node.radius, node.radius * 2, node.radius * 2);
        } else {
          ctx.fillStyle = "#238636";
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.font = `bold ${10 / camera.zoom}px system-ui`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(node.name.slice(0, 2), node.x, node.y);
        }
        ctx.restore();

        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.strokeStyle = "#f0f6fc";
        ctx.lineWidth = 2 / camera.zoom;
        ctx.stroke();

        ctx.fillStyle = "#c9d1d9";
        ctx.font = `${11 / camera.zoom}px system-ui`;
        ctx.textAlign = "center";
        ctx.fillText(node.name, node.x, node.y + node.radius + (12 / camera.zoom));
      });

      ctx.restore();
    }

    function screenToWorld(sx, sy) {
      return {
        x: (sx - width / 2 - camera.x) / camera.zoom,
        y: (sy - height / 2 - camera.y) / camera.zoom
      };
    }

    // Gestos táctiles
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let initialTouchDist = null;
    let initialZoom = 1.0;
    let touchStartPos = { x: 0, y: 0 };
    let didMoveSignificantly = false;

    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        dragStart = { x: e.touches[0].clientX - camera.x, y: e.touches[0].clientY - camera.y };
        touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        didMoveSignificantly = false;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialZoom = camera.zoom;
      }
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isDragging) {
        if (Math.hypot(e.touches[0].clientX - touchStartPos.x, e.touches[0].clientY - touchStartPos.y) > 6) {
          didMoveSignificantly = true;
        }
        camera.x = e.touches[0].clientX - dragStart.x;
        camera.y = e.touches[0].clientY - dragStart.y;
        render();
      } else if (e.touches.length === 2 && initialTouchDist) {
        didMoveSignificantly = true;
        const currentDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        camera.zoom = Math.min(Math.max(initialZoom * (currentDist / initialTouchDist), camera.minZoom), camera.maxZoom);
        render();
      }
    }, { passive: false });

    canvas.addEventListener("touchend", (e) => {
      if (!didMoveSignificantly && e.changedTouches.length === 1) {
        const touch = e.changedTouches[0];
        checkClick(touch.clientX, touch.clientY);
      }
      if (e.touches.length === 0) isDragging = false;
      initialTouchDist = null;
    });

    // Ratón
    canvas.addEventListener("mousedown", (e) => {
      isDragging = true;
      dragStart = { x: e.clientX - camera.x, y: e.clientY - camera.y };
      touchStartPos = { x: e.clientX, y: e.clientY };
      didMoveSignificantly = false;
    });

    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      if (Math.hypot(e.clientX - touchStartPos.x, e.clientY - touchStartPos.y) > 5) {
        didMoveSignificantly = true;
      }
      camera.x = e.clientX - dragStart.x;
      camera.y = e.clientY - dragStart.y;
      render();
    });

    window.addEventListener("mouseup", (e) => {
      if (!didMoveSignificantly && isDragging) {
        checkClick(e.clientX, e.clientY);
      }
      isDragging = false;
    });

    canvas.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 0.88;
      camera.zoom = Math.min(Math.max(camera.zoom * factor, camera.minZoom), camera.maxZoom);
      render();
    }, { passive: false });

    function checkClick(sx, sy) {
      const world = screenToWorld(sx, sy);
      for (const node of nodes) {
        if (Math.hypot(node.x - world.x, node.y - world.y) <= node.radius * 1.3) {
          openModal(node);
          break;
        }
      }
    }

    function openModal(node) {
      modalTitle.textContent = node.name;

      // Píldoras de emoción
      modalTags.innerHTML = "";
      node.weights.forEach((w, idx) => {
        if (w > 0) {
          const badge = document.createElement("div");
          badge.className = "tag-badge";
          badge.textContent = `${emotions[idx].name}: ${Math.round(w * 100)}%`;
          modalTags.appendChild(badge);
        }
      });

      // Collage dinámico sin huecos
      modalCollage.innerHTML = "";
      const count = node.images.length;
      modalCollage.className = "collage-container " + (
        count === 1 ? "count-1" :
        count === 2 ? "count-2" :
        count === 3 ? "count-3" :
        count === 4 ? "count-4" : "count-many"
      );

      node.images.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        modalCollage.appendChild(img);
      });

      // Créditos y autoría
      if (node.credits) {
        if (node.credits.url) {
          modalCredits.innerHTML = `Crédito imagen: <a href="${node.credits.url}" target="_blank" rel="noopener noreferrer">${node.credits.text} ↗</a>`;
        } else {
          modalCredits.textContent = `Crédito imagen: ${node.credits.text}`;
        }
        modalCredits.style.display = "block";
      } else {
        modalCredits.style.display = "none";
      }

      modal.classList.add("active");
    }

    modalClose.addEventListener("click", () => modal.classList.remove("active"));
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.remove("active");
    });

    document.getElementById("zoomIn").addEventListener("click", () => {
      camera.zoom = Math.min(camera.zoom * 1.25, camera.maxZoom);
      render();
    });
    document.getElementById("zoomOut").addEventListener("click", () => {
      camera.zoom = Math.max(camera.zoom * 0.8, camera.minZoom);
      render();
    });
    document.getElementById("zoomReset").addEventListener("click", () => {
      camera.x = 0;
      camera.y = 0;
      camera.zoom = 1.0;
      render();
    });

    computeNodes();
    resize();
  </script>
</body>
</html>
