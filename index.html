<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Atlas de Obsesiones</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* Solo título, limpio y sin subtítulo */
    header {
      position: absolute;
      top: 20px;
      left: 24px;
      z-index: 10;
      pointer-events: none;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      color: #f0f6fc;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.8);
    }

    #viewport {
      width: 100vw;
      height: 100vh;
      position: relative;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* Controles de Zoom Flotantes */
    .controls {
      position: absolute;
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .btn-ctrl {
      width: 44px;
      height: 44px;
      background: rgba(22, 27, 34, 0.85);
      color: #f0f6fc;
      border: 1px solid #30363d;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    }

    .btn-ctrl:active {
      background: #21262d;
      transform: scale(0.92);
    }

    /* Modal / Pop-up de Collage */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      max-width: 620px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      transform: scale(0.96);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #21262d;
    }

    .modal-header h2 {
      font-size: 1.25rem;
      color: #f0f6fc;
      font-weight: 700;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
    }

    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Collage dinámico sin huecos */
    .collage-container {
      display: grid;
      gap: 8px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #0d1117;
      grid-auto-flow: dense;
    }

    .collage-container.count-1 {
      grid-template-columns: 1fr;
      max-height: 380px;
    }

    .collage-container.count-2 {
      grid-template-columns: 1fr 1fr;
      max-height: 320px;
    }

    .collage-container.count-3 {
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 150px 150px;
    }
    .collage-container.count-3 img:first-child {
      grid-row: span 2;
    }

    .collage-container.count-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 140px 140px;
    }

    .collage-container.count-many {
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 120px;
    }

    .collage-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #58a6ff;
    }

    .modal-desc {
      font-size: 0.92rem;
      color: #c9d1d9;
      line-height: 1.55;
    }
  </style>
</head>

    </div>
  </div>
