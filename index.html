<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Atlas de Obsesiones - Hexágono Emocional</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #0b0e14;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header flotante */
    header {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 10;
      pointer-events: none;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #f0f6fc;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
    }

    header p {
      font-size: 0.8rem;
      color: #8b949e;
      margin-top: 2px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
    }

    /* Contenedor del Canvas */
    #viewport {
      width: 100vw;
      height: 100vh;
      position: relative;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active {
      cursor: grabbing;
    }

    /* Controles de Zoom Flotantes */
    .controls {
      position: absolute;
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 10;
    }

    .btn-ctrl {
      width: 44px;
      height: 44px;
      background: rgba(22, 27, 34, 0.85);
      color: #f0f6fc;
      border: 1px solid #30363d;
      border-radius: 50%;
      font-size: 1.2rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      transition: background 0.15s, transform 0.1s;
    }

    .btn-ctrl:active {
      background: #21262d;
      transform: scale(0.92);
    }

    /* Modal / Pop-up de Detalle y Collage */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 20px;
      max-width: 650px;
      width: 100%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #21262d;
    }

    .modal-header h2 {
      font-size: 1.3rem;
      color: #f0f6fc;
      font-weight: 700;
    }

    .btn-close {
      background: transparent;
      border: none;
      color: #8b949e;
      font-size: 1.6rem;
      line-height: 1;
      cursor: pointer;
      padding: 4px;
    }

    .modal-body {
      padding: 20px 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Contenedor de Collage sin huecos */
    .collage-container {
      display: grid;
      gap: 8px;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #0d1117;
      grid-auto-flow: dense;
    }

    .collage-container.count-1 {
      grid-template-columns: 1fr;
      max-height: 420px;
    }

    .collage-container.count-2 {
      grid-template-columns: 1fr 1fr;
      max-height: 340px;
    }

    .collage-container.count-3 {
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 170px 170px;
    }
    .collage-container.count-3 img:first-child {
      grid-row: span 2;
    }

    .collage-container.count-4 {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 160px 160px;
    }

    .collage-container.count-many {
      grid-template-columns: repeat(3, 1fr);
      grid-auto-rows: 130px;
    }

    .collage-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.2s ease;
    }

    .collage-container img:active {
      transform: scale(0.98);
    }

    /* Píldoras de Emociones */
    .modal-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-badge {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 20px;
      background: #21262d;
      border: 1px solid #30363d;
      color: #58a6ff;
    }

    .modal-desc {
      font-size: 0.9rem;
      color: #c9d1d9;
      line-height: 1.55;
    }
  </style>
</head>
<body>

  <header>
    <h1>Atlas de Obsesiones</h1>
    <p>Hexágono emocional interactivo (Ekman / Valencia-Activación)</p>
  </header>

  <div id="viewport">
    <canvas id="atlasCanvas"></canvas>
  </div>

  <div class="controls">
    <button class="btn-ctrl" id="zoomIn" title="Acercar">+</button>
    <button class="btn-ctrl" id="zoomOut" title="Alejar">−</button>
    <button class="btn-ctrl" id="zoomReset" title="Centrar">⟲</button>
  </div>

  <!-- Modal inmersivo con collage -->
  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="modalTitle">Detalle</h2>
        <button class="btn-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body">
        <div id="modalCollage" class="collage-container"></div>
        <div class="modal-tags" id="modalTags"></div>
        <p class="modal-desc" id="modalDesc"></p>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("atlasCanvas");
    const ctx = canvas.getContext("2d");
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalClose = document.getElementById("modalClose");
    const modalCollage = document.getElementById("modalCollage");
    const modalTags = document.getElementById("modalTags");
    const modalDesc = document.getElementById("modalDesc");

    // Dimensiones y resolución física
    let width, height;
    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
      render();
    }
    window.addEventListener("resize", resize);

    // Sistema de Coordenadas de Cámara (Zoom y Paneo)
    let camera = {
      x: 0,
      y: 0,
      zoom: 1.0,
      minZoom: 0.5,
      maxZoom: 4.0
    };

    const BASE_RADIUS = 320;
    const NODE_RADIUS = 24;

    // Vértices de Ekman ordenados por Valencia / Activación
    const emotions = [
      { name: "Alegría",  angle: 0 },
      { name: "Sorpresa", angle: Math.PI / 3 },
      { name: "Miedo",    angle: (2 * Math.PI) / 3 },
      { name: "Ira",      angle: Math.PI },
      { name: "Asco",     angle: (4 * Math.PI) / 3 },
      { name: "Tristeza", angle: (5 * Math.PI) / 3 }
    ];

    // Array de Elementos (Soporta una o varias imágenes por nodo)
    // Orden de pesos: [Alegría, Sorpresa, Miedo, Ira, Asco, Tristeza]
    const items = [
      {
        id: "hilbert",
        name: "Hotel de Hilbert",
        weights: [0.45, 0.55, 0.0, 0.0, 0.0, 0.0],
        images: ["img/hilbert.png"],
        desc: "Constante abstracta y comodín conceptual siempre disponible. Paradoja del infinito, juego mental y anclaje seguro."
      },
      {
        id: "gatita",
        name: "Tu gatita",
        weights: [0.50, 0.15, 0.35, 0.0, 0.0, 0.0],
        images: ["img/gatita.png", "img/gatita2.png"], // Soporta múltiples fotos para collage
        desc: "Ternura vulnerable y amor absoluto conviviendo con la alerta ante sus ataques imprevistos."
      },
      {
        id: "orquideas",
        name: "Las orquídeas",
        weights: [0.40, 0.60, 0.0, 0.0, 0.0, 0.0],
        images: ["img/orquideas.png"],
        desc: "Belleza simétrica unida al asombro por formas insólitas, antropomórficas y mimetismo botánico (Orchis italica)."
      },
      {
        id: "luz",
        name: "La luz",
        weights: [0.50, 0.0, 0.0, 0.0, 0.0, 0.50],
        images: ["img/luz.png"],
        desc: "Regulador biológico y anímico primordial: claridad expansiva frente a melancolía y pesadez en penumbra."
      },
      {
        id: "avatar",
        name: "Avatar (Universo)",
        weights: [0.35, 0.55, 0.0, 0.0, 0.0, 0.10],
        images: ["img/avatar.png"],
        desc: "Worldbuilding inmersivo monumental, fascinación bio-luminiscente y elegía natural."
      },
      {
        id: "terror",
        name: "Terror Cautivador",
        weights: [0.0, 0.35, 0.50, 0.0, 0.0, 0.15],
        images: ["img/terror.png"],
        desc: "Nuestra parte de noche, AHS. Lo siniestro llevado al arte: mundos rituales, oscuros, intensos y perturbadoramente bellos."
      },
      {
        id: "arcane",
        name: "Arcane",
        weights: [0.0, 0.25, 0.0, 0.40, 0.0, 0.35],
        images: ["img/arcane.png"],
        desc: "Tragedia visceral, ruptura de lazos filiales, tensión de clases y maestría plástica y cinética."
      },
      {
        id: "discos",
        name: "Discos en bucle",
        weights: [0.40, 0.0, 0.15, 0.0, 0.0, 0.45],
        images: ["img/discos.png"],
        desc: "Brock, Isaiah Rashad, Baño María, Deltaplane... Paisaje sonoro íntimo y refugio para procesar estados sin interferencia."
      },
      {
        id: "vulneracion",
        name: "Vulneración de identidad",
        weights: [0.0, 0.0, 0.0, 0.60, 0.40, 0.0],
        images: ["img/vulneracion.png"],
        desc: "Rechazo visceral y principio de vida ético: furia e indignación moral absoluta ante la homofobia, el racismo y el capacitismo."
      },
      {
        id: "hermanos",
        name: "Hermanos",
        weights: [0.65, 0.15, 0.20, 0.0, 0.0, 0.0],
        images: ["img/hermanos.png"],
        desc: "Complicidad de origen, lealtad innegociable y protectora."
      },
      {
        id: "padre",
        name: "Padre",
        weights: [0.60, 0.15, 0.0, 0.0, 0.0, 0.25],
        images: ["img/padre.png"],
        desc: "Pilar de estabilidad, arraigo, memoria generacional y respeto."
      },
      {
        id: "naturaleza",
        name: "Huida a la naturaleza",
        weights: [0.70, 0.20, 0.0, 0.0, 0.0, 0.10],
        images: ["img/naturaleza.png"],
        desc: "Necesidad periódica de fuga silvestre. Descompresión nerviosa lejos del cemento y retorno al silencio orgánico."
      }
    ];

    // Carga de imágenes para el canvas (avatar circular)
    const imageCache = {};
    items.forEach(item => {
      const img = new Image();
      img.src = item.images[0];
      img.onload = () => render();
      imageCache[item.id] = img;
    });

    // 1. Cálculo de Posición Baricéntrica + Motor Anti-Colisión
    let nodes = [];
    function computeNodePositions() {
      // Cálculo baricéntrico puro
      nodes = items.map(item => {
        let bx = 0, by = 0;
        item.weights.forEach((w, idx) => {
          bx += w * (BASE_RADIUS * Math.cos(emotions[idx].angle));
          by += w * (-BASE_RADIUS * Math.sin(emotions[idx].angle));
        });
        return {
          ...item,
          origX: bx,
          origY: by,
          x: bx,
          y: by,
          radius: NODE_RADIUS
        };
      });

      // Simulación de relajación elástica para evitar solapes
      const minDist = NODE_RADIUS * 2.3;
      for (let iter = 0; iter < 60; iter++) {
        for (let i = 0; i < nodes.length; i++) {
          for (let j = i + 1; j < nodes.length; j++) {
            const dx = nodes[j].x - nodes[i].x;
            const dy = nodes[j].y - nodes[i].y;
            const dist = Math.hypot(dx, dy) || 0.001;
            if (dist < minDist) {
              const overlap = (minDist - dist) / 2;
              const nx = dx / dist;
              const ny = dy / dist;
              nodes[i].x -= nx * overlap;
              nodes[i].y -= ny * overlap;
              nodes[j].x += nx * overlap;
              nodes[j].y += ny * overlap;
            }
          }
          // Fuerza de anclaje a su posición matemática original
          nodes[i].x += (nodes[i].origX - nodes[i].x) * 0.05;
          nodes[i].y += (nodes[i].origY - nodes[i].y) * 0.05;
        }
      }
    }

    // 2. Renderizado en Canvas con Matriz de Transformación
    function render() {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      ctx.save();
      // Centrar el origen en el viewport y aplicar Pan & Zoom
      ctx.translate(width / 2 + camera.x, height / 2 + camera.y);
      ctx.scale(camera.zoom, camera.zoom);

      // Dibujar Hexágono concéntrico
      [0.33, 0.66, 1.0].forEach(level => {
        ctx.strokeStyle = level === 1.0 ? "#30363d" : "#1c2128";
        ctx.lineWidth = (level === 1.0 ? 2 : 1) / camera.zoom;
        ctx.beginPath();
        emotions.forEach((e, i) => {
          const vx = BASE_RADIUS * level * Math.cos(e.angle);
          const vy = -BASE_RADIUS * level * Math.sin(e.angle);
          if (i === 0) ctx.moveTo(vx, vy);
          else ctx.lineTo(vx, vy);
        });
        ctx.closePath();
        ctx.stroke();
      });

      // Ejes radiales y etiquetas de las emociones
      emotions.forEach(e => {
        const vx = BASE_RADIUS * Math.cos(e.angle);
        const vy = -BASE_RADIUS * Math.sin(e.angle);

        ctx.strokeStyle = "#21262d";
        ctx.lineWidth = 1.2 / camera.zoom;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(vx, vy);
        ctx.stroke();

        const lx = (BASE_RADIUS + 34) * Math.cos(e.angle);
        const ly = -(BASE_RADIUS + 34) * Math.sin(e.angle);

        ctx.fillStyle = "#58a6ff";
        ctx.font = `bold ${13 / camera.zoom}px system-ui`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(e.name, lx, ly);
      });

      // Dibujar Nodos con sus imágenes circulares
      nodes.forEach(node => {
        const img = imageCache[node.id];

        ctx.save();
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.clip();

        if (img && img.complete && img.naturalWidth !== 0) {
          ctx.drawImage(
            img,
            node.x - node.radius,
            node.y - node.radius,
            node.radius * 2,
            node.radius * 2
          );
        } else {
          // Color de respaldo elegante
          ctx.fillStyle = "#238636";
          ctx.fill();
          ctx.fillStyle = "#ffffff";
          ctx.font = `bold ${10 / camera.zoom}px system-ui`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(node.name.slice(0, 3), node.x, node.y);
        }
        ctx.restore();

        // Borde exterior del nodo
        ctx.beginPath();
        ctx.arc(node.x, node.y, node.radius, 0, Math.PI * 2);
        ctx.strokeStyle = "#f0f6fc";
        ctx.lineWidth = 2 / camera.zoom;
        ctx.stroke();

        // Etiqueta de texto debajo del nodo
        ctx.fillStyle = "#c9d1d9";
        ctx.font = `${11 / camera.zoom}px system-ui`;
        ctx.textAlign = "center";
        ctx.fillText(node.name, node.x, node.y + node.radius + (12 / camera.zoom));
      });

      ctx.restore();
    }

    // 3. Manejo de Gestos Táctiles (Pinch to Zoom, Pan) y Ratón
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let initialTouchDist = null;
    let initialZoom = 1.0;
    let touchStartPos = { x: 0, y: 0 };
    let didMoveSignificantly = false;

    // Convertir coordenadas de pantalla a espacio mundo
    function screenToWorld(sx, sy) {
      return {
        x: (sx - width / 2 - camera.x) / camera.zoom,
        y: (sy - height / 2 - camera.y) / camera.zoom
      };
    }

    // Touch events (iPad, móvil)
    canvas.addEventListener("touchstart", (e) => {
      if (e.touches.length === 1) {
        isDragging = true;
        dragStart = { x: e.touches[0].clientX - camera.x, y: e.touches[0].clientY - camera.y };
        touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        didMoveSignificantly = false;
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialTouchDist = Math.hypot(
          e.touches[0].clientX - e.touches[1].clientX,
          e.touches[0].clientY - e.touches[1].clientY
        );
        initialZoom = camera.zoom;
      }
    }, { passive: false });

    canvas.addEventListener("touchmove", (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && isDragging) {
        const dx = e.touches[0].clientX - dragStart.x;
        const dy = e.touches[0].clientY - dragStart.y;
        if (Math.hypot(e.touches[0].clientX - touchStartPos.x, e.touches[0].clientY - touchStartPos.y) > 8) {
          didMoveSignificantly = true;
        }
        camera.x = dx;
        camera.y = dy;
        render();
      } else if (e.touches.length === 2
